# Pass this file with: uv run run_query.py --config configs/benchmark_example.yaml
# Explicit command-line options override these values.
plan_source: pb_plans

benchmark:
  runs: 20
  warmup_runs: 0
  workers_per_cu: 48
  scale_factor: 2

# Describe the settings used to generate the prebuilt plans.
# This metadata does not enable or disable optimizations in the runner.
optimization:
  mat_type: lateMatHybrid  # std, lateMat, or lateMatHybrid
  gco: false
  merge_sort: true
  semi_joins: false
  materialize_into_join: false

# Additional experiment variant metadata.
variant:
  materialize_into_join: false

experiment:
  reason: "Test late-no-gco plans without materialization merged into joins"
  notes: "Add machine, data, or revision notes here."

# Pass this file with: uv run run_query.py --config configs/benchmark_example.yaml
# Explicit command-line options override these values.
# --config selects this file; --help displays CLI usage (neither is a YAML setting).
plan_source: plans

benchmark:
  execution_mode: concurrent  # sequential or concurrent
  runs: 10
  warmup_runs: 0
  write_benchmark_results: true  # --write-benchmark-results / --no-write-benchmark-results

  # Optional ram tracking (RSS measurement + per-operator memory tracking); enabling it also writes benchmark results.
  memtrack: true  # --memtrack / --no-memtrack; needs a CU built with RAM_TRACKING
  memory_interval_ms: 20.0  # --memory-interval-ms
  memory_baseline_ms: 500.0  # --memory-baseline-ms
  memory_tail_ms: 500.0  # --memory-tail-ms

# Describe the actual ComputeUnit build; these values do not change compilation.
compilation:
  optimization_level: -O3
  log_level: LOG_INFO

# Describe the settings used to generate the prebuilt plans.
# This metadata does not enable or disable optimizations in the runner.
optimization:
  mat_type: lateMat  # std, lateMat, or lateMatHybrid
  gco: false
  merge_sort: true
  semi_joins: false
  materialize_into_join: false

# Additional experiment variant metadata.
# --variant KEY=VALUE overrides/adds entries here; the flag can be repeated.
variant:
  materialize_into_join: false

experiment:
  reason: "Baseline late-no-gco plans without materialization merged into joins"
  notes: "Add machine, data, or revision notes here."
